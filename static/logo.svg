<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="opti-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#00a884"/>
    </linearGradient>
    <linearGradient id="opti-cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="opti-cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="opti-ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="opti-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 3D Cyan/Teal Isometric Optimization Cube -->
  <g transform="translate(4, 5)">
    <!-- Shadow -->
    <ellipse cx="19" cy="35" rx="14" ry="3.5" fill="#000000" opacity="0.3"/>
    
    <!-- Isometric Cube Faces -->
    <!-- Top Face -->
    <path d="M19 4 L33 12 L19 20 L5 12 Z" fill="url(#opti-cube-top)"/>
    <!-- Left Face -->
    <path d="M5 12 L19 20 L19 33 L5 25 Z" fill="url(#opti-cube-left)"/>
    <!-- Right Face -->
    <path d="M19 20 L33 12 L33 25 L19 33 Z" fill="url(#opti-cube-right)"/>

    <!-- Neural / Distribution Network Circuit Overlay -->
    <path d="M12 8 L19 12 L26 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M19 12 L19 20" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Central Optimization Pulse Node -->
    <circle cx="19" cy="12" r="2.4" fill="#ffffff" filter="url(#opti-glow)"/>
    <circle cx="12" cy="8" r="1.3" fill="#ffffff"/>
    <circle cx="26" cy="8" r="1.3" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="46" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">OptiStock</text>
  
  <!-- AI Pill Badge -->
  <g transform="translate(148, 11)">
    <rect width="32" height="20" rx="5" fill="url(#opti-ai-grad)"/>
    <text x="16" y="14.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">AI</text>
  </g>

  <!-- Tagline underneath -->
  <text x="47" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8" letter-spacing="0.04em">DISTRIBUTION INTELLIGENCE</text>
</svg>
