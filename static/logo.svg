<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56" fill="none">
  <defs>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ai-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Isometric Smart Node Cube Icon -->
  <g transform="translate(6, 6)">
    <!-- Shadow -->
    <ellipse cx="22" cy="40" rx="16" ry="4" fill="#0f172a" opacity="0.12"/>
    
    <!-- Isometric Cube Faces -->
    <!-- Top Face -->
    <path d="M22 6 L38 15 L22 24 L6 15 Z" fill="url(#cube-top)"/>
    <!-- Left Face -->
    <path d="M6 15 L22 24 L22 39 L6 30 Z" fill="url(#cube-left)"/>
    <!-- Right Face -->
    <path d="M22 24 L38 15 L38 30 L22 39 Z" fill="url(#cube-right)"/>

    <!-- Neural / Optimization Circuit Lines on Top -->
    <path d="M14 10.5 L22 15 L30 10.5" stroke="#93c5fd" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 15 L22 24" stroke="#60a5fa" stroke-width="1.75" stroke-linecap="round"/>
    
    <!-- Central Optimization Pulse Node -->
    <circle cx="22" cy="15" r="2.75" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="14" cy="10.5" r="1.5" fill="#ffffff"/>
    <circle cx="30" cy="10.5" r="1.5" fill="#ffffff"/>
    <circle cx="22" cy="31.5" r="1.5" fill="#93c5fd"/>
  </g>

  <!-- Brand Typography -->
  <text x="58" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">OptiStock</text>
  
  <!-- AI Pill Badge -->
  <g transform="translate(168, 14)">
    <rect width="36" height="23" rx="6" fill="url(#ai-badge)"/>
    <text x="18" y="16.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.06em">AI</text>
  </g>
</svg>
